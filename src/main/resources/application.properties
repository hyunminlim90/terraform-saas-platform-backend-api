spring.application.name=sprout

# Tomcat
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=1024
server.connection-timeout=300000
server.tomcat.keep-alive-timeout=60s
server.tomcat.max-keep-alive-requests=100

# HikariCP
spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# https 설정 (classpath = **/resources)
server.port=443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=sprout1234!!
server.ssl.key-password=sprout1234!!
server.ssl.key-alias=java-sprout.opentofu.click
server.ssl.key-store-type=PKCS12

# JSESSIONID (JSESSIONID 쿠키가 same site = none 으로 해야 백엔드 서버로 전송되고 30분간 세션이 유지됨, 유지 안되면 csrf 저장소에서 csrf 토큰이 계속 재 발행되서 변경됨, jsession 쿠키는 30m 이 기본 지정임)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.same-site=none
server.servlet.session.timeout=6h

# Property Naming Strategy
spring.jackson.property-naming-strategy=SNAKE_CASE

# 서버 에러 출력
server.error.include-exception=true
server.error.include-stacktrace=always
server.error.include-message=always

# 로깅 레벨 설정 (배포 & 로컬) journalctl -u java-sprout -f
logging.file.name=/home/ec2-user/log/java-sprout-app.log
logging.level.root=DEBUG

logging.level.org.springframework=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.web.csrf.CsrfFilter=DEBUG

logging.level.click.opentofu.sprout=DEBUG
logging.level.click.opentofu.sprout.servlet.filter.CustomCsrfFilter=DEBUG

# MySQL 데이터베이스 연결 설정
spring.datasource.url=jdbc:mysql://mysql.private.mysql:3306/awscloud_sprout?useUnicode=true&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=sysadmin
spring.datasource.password=Sysadmin1234!!

# JPA 설정
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.format_sql=true

spring.mvc.async.request-timeout=3600000

# REST 클라이언트 호출 URLs
sso.publicKeyUrl=https://java-sso.opentofu.click:443/api/v1/public-key

# Redis
spring.redis.host=redis.opentofu.click
spring.redis.port=6379
